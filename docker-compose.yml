services:
  postgres:
    image: postgres:16-alpine
    container_name: f1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-f1db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - f1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1user} -d ${POSTGRES_DB:-f1db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  f1_postgres_data:
